[package]
name = "zodiac"
version = "0.3.0"
edition = "2024"
description = "Fast, lightweight embedded ZIM reader and MCP server for offline Wikipedia and ZIM archives"

[dependencies]
html-to-markdown-rs = { version = "3.18.6", features = ["visitor"] }
json = "0.12.4"
zim = "0.5.0"

[lib]
name = "zodiac"
path = "src/lib.rs"

[[bin]]
name = "zodiac"
path = "src/main.rs"
